name: Update Stats

on:
  schedule:
    - cron: '0 0 1 * *'  # 1st of every month, midnight UTC
  workflow_dispatch:      # allow manual trigger

permissions:
  contents: write
  actions: write  # dispatch the CV builds after a stats commit (last step)

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Note: Scholar scraping typically fails from CI (datacenter IP).
      # SerpAPI is the reliable path. Without SERPAPI_KEY, Scholar stats
      # are preserved from the last successful run.
      - run: node scripts/update-stats.js
        env:
          GH_USER_TOKEN: ${{ secrets.GH_PAT }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}

      # Lists the skills in yi-li-yang/skills for the website's Projects atlas. Fails safe on its own:
      # on an error it leaves data/claude-skills.json as it was, so it never fails the job.
      - run: node scripts/fetch-skills.js
        env:
          GH_USER_TOKEN: ${{ secrets.GH_PAT }}

      - name: Validate stats JSON
        run: node -e "const s=require('./data/stats.json');if(!s.profiles||!s.lastUpdated)process.exit(1)"

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stats.json data/claude-skills.json
          if git diff --cached --quiet; then
            echo "stats unchanged — nothing to commit"
          else
            git commit -m "chore: update stats [automated]"
            git push
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with GITHUB_TOKEN never triggers another workflow, so the commit above
      # does not start Build CV or Tailor CV the way a human push to data/ would, and the PDFs
      # keep printing last month's citation, repo and commit counts. workflow_dispatch is the
      # one event GITHUB_TOKEN may fire. Tailor CV with no slug rebuilds every drafting
      # application; submitted/ stays frozen.
      - name: Rebuild the CVs from the new stats
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-cv.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
          gh workflow run tailor-cv.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
