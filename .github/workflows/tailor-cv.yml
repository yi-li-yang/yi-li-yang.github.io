name: Tailor CV

# Compiles job-tailored one-pagers and cover letters from applications/<status>/<slug>/.
#
# Each application is a SELECTION over the data layer: every claim carries a `src` citation
# resolved by scripts/verify-application.js. That verifier runs here, in --strict mode, BEFORE
# anything compiles — the firewall has to hold in CI, not just on a laptop, or an unsourced
# claim ships with a green tick beside it.
#
# The PDFs are uploaded as artifacts, never committed: a tailored CV is an ephemeral
# per-application output. The manifest and letter.json are the sources of truth.

on:
  push:
    paths:
      - 'applications/**'
      - 'data/**'
      - 'cv/**'
      - 'scripts/**'
      - '.github/workflows/tailor-cv.yml'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Build only this application slug (blank = all buildable)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  # Status is the directory: applications/{drafting,submitted,closed}/<slug>/.
  # `closed` is skipped — a closed application never needs rebuilding, and skipping it is what
  # keeps CI time flat as the directory grows.
  discover:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.find.outputs.slugs }}
      count: ${{ steps.find.outputs.count }}
    steps:
      - uses: actions/checkout@v4

      - id: find
        name: Find buildable applications
        run: |
          if [ -n "${{ inputs.slug }}" ]; then
            slugs=$(printf '%s\n' "${{ inputs.slug }}" | jq -R . | jq -sc .)
          else
            # applications/<status>/<slug>/manifest.json -> field 3 is the slug
            slugs=$(find applications/drafting applications/submitted \
                      -mindepth 2 -maxdepth 2 -name manifest.json 2>/dev/null \
                    | awk -F/ '{print $3}' | sort -u | jq -R . | jq -sc .)
          fi
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$slugs" | jq 'length')" >> "$GITHUB_OUTPUT"
          echo "Building: $slugs"
          closed=$(find applications/closed -mindepth 2 -maxdepth 2 -name manifest.json 2>/dev/null | wc -l)
          [ "$closed" -gt 0 ] && echo "::notice::Skipping $closed closed application(s)." || true

  tailor:
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one bad application must not hide the others' results
      matrix:
        slug: ${{ fromJson(needs.discover.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # The variant shell \inputs metrics.tex, which tailor.js copies into build/<slug>/.
      - name: Generate metrics
        run: node scripts/emit-metrics-tex.js

      # THE GATE, then the render. `tailor` runs the verifier itself, but --strict lives here:
      # locally the smell-test warnings are advisory because a human is reading them; in CI
      # nobody reads a warning, so they become failures.
      - name: Verify every claim traces to the data layer
        run: node scripts/verify-application.js "${{ matrix.slug }}" --strict

      - name: Render tailored CV and cover letter
        run: node scripts/tailor.js "${{ matrix.slug }}" --skip-verify

      # build/<slug>/ is self-contained — tailor.js copied the .cls and fonts/ in, because
      # the class resolves `Path = fonts/lato/` against the working directory.
      - name: Compile tailored one-pager (XeLaTeX)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          working_directory: build/${{ matrix.slug }}
          latexmk_use_xelatex: true

      # letter.json is optional — an application may be CV-only.
      - id: letter
        name: Is there a cover letter?
        run: |
          if [ -f "build/${{ matrix.slug }}/letter.tex" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No letter.json for ${{ matrix.slug }} — building the CV only."
          fi

      - name: Compile cover letter (XeLaTeX)
        if: steps.letter.outputs.exists == 'true'
        uses: xu-cheng/latex-action@v3
        with:
          root_file: letter.tex
          working_directory: build/${{ matrix.slug }}
          latexmk_use_xelatex: true

      # The Deedy template overflows to a second page silently, and a tailored variant adds a
      # publications block to an already-full page. A two-page "one-pager" is the most likely
      # way this goes wrong unnoticed, so assert it rather than trusting a glance.
      - name: Assert the one-pager is one page
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pages=$(pdfinfo "build/${{ matrix.slug }}/cv.pdf" | awk '/^Pages:/ {print $2}')
          echo "one-pager pages: $pages"
          if [ "$pages" -ne 1 ]; then
            echo "::error::Tailored one-pager is $pages pages. Trim the manifest (fewer bullets, fewer skill lines, fewer publications)."
            exit 1
          fi

      - name: Collect artifacts under stable names
        run: |
          mkdir -p out
          cp "build/${{ matrix.slug }}/cv.pdf" "out/cv_${{ matrix.slug }}.pdf"
          if [ "${{ steps.letter.outputs.exists }}" = "true" ]; then
            cp "build/${{ matrix.slug }}/letter.pdf" "out/coverletter_${{ matrix.slug }}.pdf"
            cp "build/${{ matrix.slug }}/letter.txt" "out/coverletter_${{ matrix.slug }}.txt"
          fi
          # The posting this was aimed at travels with the outputs, so a downloaded bundle is
          # self-explanatory months later.
          find applications -name job.md -path "*/${{ matrix.slug }}/*" \
            -exec cp {} "out/job_${{ matrix.slug }}.md" \; || true

      - name: Upload application bundle
        uses: actions/upload-artifact@v4
        with:
          name: application-${{ matrix.slug }}
          path: out/
          if-no-files-found: error
