name: Tailor CV

# Compiles job-tailored one-pagers and cover letters from applications/<status>/<slug>/, then
# COMMITS THE DOCUMENTS BACK BESIDE THEIR APPLICATION.
#
# Output lives with input on purpose: an application folder is the complete record of one job —
# the posting, the selection made from it, and the documents that went out. CI artifacts expire
# after 90 days, and a rebuild months later would not reproduce them anyway, because the
# citation counts in data/stats.json move underneath. So the PDF is committed.
#
# Every claim carries a `src` citation resolved by scripts/verify-application.js, which runs
# here in --strict mode BEFORE anything compiles — the firewall has to hold in CI, not just on
# a laptop, or an unsourced claim ships with a green tick beside it.
#
# A push builds ONLY the drafting applications it actually touched. See the `discover` job for
# why, and for what happens when a shared input (data/, cv/, scripts/) moves instead.

on:
  push:
    paths:
      - 'applications/**'
      - 'data/**'
      - 'cv/**'
      - 'scripts/**'
      - '.github/workflows/tailor-cv.yml'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Build this application slug, any status (blank = every drafting application)'
        required: false
        type: string

# Two runs committing to the same branch would race. Make the newer one wait, not fail.
concurrency:
  group: tailor-cv
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # Status is the directory: applications/{drafting,submitted,closed}/<slug>/.
  #
  # A push builds only the DRAFTING applications whose own directory it changed. Two reasons:
  #
  #   1. The edge stamp is \today (deedy-resume-openfont.cls). Rebuilding an untouched
  #      application on a later day produces different PDF bytes, so the commit job rewrites a
  #      document nobody asked to change — and, once an application is submitted, overwrites the
  #      only record of what was actually sent. `submitted/` therefore never builds automatically:
  #      promoting an application is what freezes its documents.
  #   2. It keeps a push proportional to the edit, instead of scaling with the whole directory.
  #
  # When a SHARED input moves (data/, cv/, scripts/) every draft is arguably stale, but rebuilding
  # them all is exactly the behaviour this job exists to stop. So they are named in a notice and
  # left alone; `workflow_dispatch` with a blank slug rebuilds every draft on purpose, and
  # dispatch with a slug reaches any application in any status.
  discover:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.find.outputs.slugs }}
      count: ${{ steps.find.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the pushed range to tell which applications changed

      - id: find
        name: Find applications this push touched
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          INPUT_SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail

          # applications/<status>/<slug>/manifest.json -> field 3 is the slug.
          # `|| true` because pipefail turns find's "no such directory" into a step failure.
          drafting() {
            { find applications/drafting -mindepth 2 -maxdepth 2 -name manifest.json 2>/dev/null \
              || true; } | awk -F/ '{print $3}' | sort -u
          }

          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$INPUT_SLUG" ]; then
            picked=$(printf '%s\n' "$INPUT_SLUG")
            echo "::notice::Dispatch: building '$INPUT_SLUG' only."
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            picked=$(drafting)
            echo "::notice::Dispatch with no slug: rebuilding every drafting application."
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # First push to a branch, or a force-push that orphaned the old tip: no usable base.
            picked=$(drafting)
            echo "::notice::No diff base for this push — falling back to every drafting application."
          else
            changed=$(git diff --name-only "$BEFORE" "$AFTER")

            # Only the SOURCE files count. cv.pdf/letter.pdf/letter.txt are this workflow's own
            # output, and the commit job writes them back into the application folder — so a push
            # landing after a build would otherwise "see" them and rebuild what the bot touched.
            src='^applications/drafting/[^/]+/(manifest\.json|letter\.json|job\.md)$'
            picked=$(printf '%s\n' "$changed" | { grep -E "$src" || true; } \
                     | awk -F/ '{print $3}' | sort -u)

            # Deleting or promoting an application leaves its slug in the diff with no manifest.
            kept=''
            for s in $picked; do
              if [ -f "applications/drafting/$s/manifest.json" ]; then
                kept="${kept}${s}"$'\n'
              fi
            done
            picked="$kept"

            # Say plainly which drafts a shared-input change did NOT refresh, so "nothing built"
            # is never mistaken for "everything is current".
            if printf '%s\n' "$changed" \
               | grep -qE '^(data|cv|scripts)/|^\.github/workflows/tailor-cv\.yml$'; then
              stale=$(comm -23 <(drafting) <(printf '%s' "$picked" | grep -v '^$' | sort -u) \
                      | paste -sd' ' - || true)
              if [ -n "$stale" ]; then
                echo "::notice::Shared inputs changed; these drafts were left alone: ${stale}." \
                     "Run this workflow manually with a blank slug to refresh them."
              fi
            fi
          fi

          slugs=$(printf '%s' "$picked" | { grep -v '^$' || true; } | sort -u | jq -R . | jq -sc .)
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$slugs" | jq 'length')" >> "$GITHUB_OUTPUT"
          echo "Building: $slugs"

          frozen=$({ find applications/submitted applications/closed \
                       -mindepth 2 -maxdepth 2 -name manifest.json 2>/dev/null || true; } | wc -l)
          if [ "$frozen" -gt 0 ]; then
            echo "::notice::$frozen submitted/closed application(s) left frozen."
          fi

  tailor:
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one bad application must not hide the others' results
      matrix:
        slug: ${{ fromJson(needs.discover.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # The variant shell \inputs metrics.tex, which tailor.js copies into build/<slug>/.
      - name: Generate metrics
        run: node scripts/emit-metrics-tex.js

      # THE GATE, then the render. `tailor` runs the verifier itself, but --strict lives here:
      # locally the smell-test warnings are advisory because a human is reading them; in CI
      # nobody reads a warning, so they become failures.
      - name: Verify every claim traces to the data layer
        run: node scripts/verify-application.js "${{ matrix.slug }}" --strict

      - name: Render tailored CV and cover letter
        run: node scripts/tailor.js "${{ matrix.slug }}" --skip-verify

      # build/<slug>/ is self-contained — tailor.js copied the .cls and fonts/ in, because
      # the class resolves `Path = fonts/lato/` against the working directory.
      - name: Compile tailored one-pager (XeLaTeX)
        uses: xu-cheng/latex-action@v3
        with:
          root_file: cv.tex
          working_directory: build/${{ matrix.slug }}
          latexmk_use_xelatex: true

      # letter.json is optional — an application may be CV-only.
      - id: letter
        name: Is there a cover letter?
        run: |
          if [ -f "build/${{ matrix.slug }}/letter.tex" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No letter.json for ${{ matrix.slug }} — building the CV only."
          fi

      - name: Compile cover letter (XeLaTeX)
        if: steps.letter.outputs.exists == 'true'
        uses: xu-cheng/latex-action@v3
        with:
          root_file: letter.tex
          working_directory: build/${{ matrix.slug }}
          latexmk_use_xelatex: true

      # The Deedy template overflows to a second page silently, and a tailored variant adds a
      # publications block to an already-full page. A two-page "one-pager" is the most likely
      # way this goes wrong unnoticed, so assert it rather than trusting a glance.
      - name: Assert one page, and a dated edge stamp
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pages=$(pdfinfo "build/${{ matrix.slug }}/cv.pdf" | awk '/^Pages:/ {print $2}')
          echo "one-pager pages: $pages"
          if [ "$pages" -ne 1 ]; then
            echo "::error::Tailored one-pager is $pages pages. Trim the manifest (fewer bullets, fewer skill lines, fewer publications)."
            exit 1
          fi

          # The CV is rebuilt whenever the data layer moves, so several PDFs of the same
          # application can exist over time. The "Last Updated" stamp in the top-right corner
          # (\lastupdated in deedy-resume-openfont.cls) is the only thing that tells them apart.
          # If it ever silently disappeared you could not tell which build you were holding.
          if ! pdftotext "build/${{ matrix.slug }}/cv.pdf" - | grep -qi "Last Updated"; then
            echo "::error::No 'Last Updated' stamp on the CV. \\lastupdated is missing from the shell or the class."
            exit 1
          fi
          echo "edge stamp: $(pdftotext "build/${{ matrix.slug }}/cv.pdf" - | grep -i 'Last Updated' | head -1)"

      # Staged under the application's own path, so the commit job can place the files without
      # rediscovering which status folder each slug lives in.
      - name: Stage the documents for commit
        run: |
          appdir=$(dirname "$(find applications -mindepth 3 -maxdepth 3 -name manifest.json \
                              -path "*/${{ matrix.slug }}/*" | head -1)")
          echo "application dir: $appdir"
          mkdir -p "out/$appdir"
          cp "build/${{ matrix.slug }}/cv.pdf" "out/$appdir/cv.pdf"
          if [ "${{ steps.letter.outputs.exists }}" = "true" ]; then
            cp "build/${{ matrix.slug }}/letter.pdf" "out/$appdir/letter.pdf"
            cp "build/${{ matrix.slug }}/letter.txt" "out/$appdir/letter.txt"
          fi

      - name: Upload documents
        uses: actions/upload-artifact@v4
        with:
          name: documents-${{ matrix.slug }}
          path: out/
          if-no-files-found: error
          retention-days: 1 # a handoff to the commit job, not the record

  # ONE job commits, after every application has built. Committing inside the matrix would have
  # parallel jobs pushing to the same branch and clobbering each other.
  commit:
    needs: [discover, tailor]
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download every application's documents
        uses: actions/download-artifact@v4
        with:
          pattern: documents-*
          merge-multiple: true # they share the applications/<status>/<slug>/ path layout
          path: incoming

      - name: Place documents beside their applications
        run: |
          cp -r incoming/applications/. applications/
          rm -rf incoming
          find applications \( -name '*.pdf' -o -name 'letter.txt' \) | sort

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add applications
          # [skip ci] so this automated commit does not retrigger the workflow.
          if git diff --cached --quiet; then
            echo "documents unchanged — nothing to commit"
          else
            git commit -m "build: tailored CV + cover letter [automated] [skip ci]"
            # Another push may have landed while this run compiled.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
