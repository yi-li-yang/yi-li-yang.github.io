name: Tailor CV

# Compiles job-tailored one-pagers and cover letters from applications/<status>/<slug>/, then
# COMMITS THE DOCUMENTS BACK BESIDE THEIR APPLICATION.
#
# Output lives with input on purpose: an application folder is the complete record of one job —
# the posting, the selection made from it, and the documents that went out. CI artifacts expire
# after 90 days, and a rebuild months later would not reproduce them anyway, because the
# citation counts in data/stats.json move underneath. So the PDF is committed.
#
# Every claim carries a `src` citation resolved by scripts/verify-application.js, which runs
# here in --strict mode BEFORE anything compiles — the firewall has to hold in CI, not just on
# a laptop, or an unsourced claim ships with a green tick beside it.
#
# A push builds ONLY the drafting applications it actually touched. See the `discover` job for
# why, and for what happens when a shared input (data/, cv/, scripts/) moves instead.

on:
  push:
    paths:
      - 'applications/**'
      - 'data/**'
      - 'cv/**'
      - 'scripts/**'
      - '.github/workflows/tailor-cv.yml'
  workflow_dispatch:
    inputs:
      slug:
        description: 'Build this application slug, any status (blank = every drafting application)'
        required: false
        type: string

# Two runs committing to the same branch would race. Make the newer one wait, not fail.
concurrency:
  group: tailor-cv
  cancel-in-progress: false

# Pinned in one place; the cache key includes it, so a bump re-primes the bundle.
env:
  TECTONIC_VERSION: '0.17.0'

permissions:
  contents: write

jobs:
  # Status is the directory: applications/{drafting,submitted,closed}/<slug>/.
  #
  # A push builds only the DRAFTING applications whose own directory it changed. Two reasons:
  #
  #   1. The edge stamp is \today (deedy-resume-openfont.cls). Rebuilding an untouched
  #      application on a later day produces different PDF bytes, so the commit job rewrites a
  #      document nobody asked to change — and, once an application is submitted, overwrites the
  #      only record of what was actually sent. `submitted/` therefore never builds automatically:
  #      promoting an application is what freezes its documents.
  #   2. It keeps a push proportional to the edit, instead of scaling with the whole directory.
  #
  # When a SHARED input moves (data/, cv/, scripts/) every draft genuinely IS stale, so every
  # draft rebuilds — that is single-sourcing working, and skipping it once meant a typesetting
  # fix never reached the tailored CVs. Derived output committed by the build itself does not
  # count as a shared input; see the `derived` filter below.
  #
  # `workflow_dispatch` with a blank slug rebuilds every draft on purpose, and dispatch with a
  # slug reaches any application in any status.
  discover:
    runs-on: ubuntu-latest
    outputs:
      slugs: ${{ steps.find.outputs.slugs }}
      count: ${{ steps.find.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need the pushed range to tell which applications changed

      - id: find
        name: Find applications this push touched
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          INPUT_SLUG: ${{ inputs.slug }}
        run: |
          set -euo pipefail

          # applications/<status>/<slug>/manifest.json -> field 3 is the slug.
          # `|| true` because pipefail turns find's "no such directory" into a step failure.
          drafting() {
            { find applications/drafting -mindepth 2 -maxdepth 2 -name manifest.json 2>/dev/null \
              || true; } | awk -F/ '{print $3}' | sort -u
          }

          if [ "$EVENT" = "workflow_dispatch" ] && [ -n "$INPUT_SLUG" ]; then
            picked=$(printf '%s\n' "$INPUT_SLUG")
            echo "::notice::Dispatch: building '$INPUT_SLUG' only."
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            picked=$(drafting)
            echo "::notice::Dispatch with no slug: rebuilding every drafting application."
          elif [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
               || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # First push to a branch, or a force-push that orphaned the old tip: no usable base.
            picked=$(drafting)
            echo "::notice::No diff base for this push — falling back to every drafting application."
          else
            changed=$(git diff --name-only "$BEFORE" "$AFTER")

            # Only the SOURCE files count. cv.pdf/letter.pdf/letter.txt are this workflow's own
            # output, and the commit job writes them back into the application folder — so a push
            # landing after a build would otherwise "see" them and rebuild what the bot touched.
            src='^applications/drafting/[^/]+/(manifest\.json|letter\.json|job\.md)$'
            picked=$(printf '%s\n' "$changed" | { grep -E "$src" || true; } \
                     | awk -F/ '{print $3}' | sort -u)

            # Deleting or promoting an application leaves its slug in the diff with no manifest.
            kept=''
            for s in $picked; do
              if [ -f "applications/drafting/$s/manifest.json" ]; then
                kept="${kept}${s}"$'\n'
              fi
            done
            picked="$kept"

            # A SHARED input — the data layer, a template, the render scripts — feeds every
            # application. Change one and every draft really is stale, so every draft rebuilds.
            # This is the single-sourcing working: a typesetting fix in cv/templates/ has to
            # reach the tailored CVs, or they quietly keep the old rendering forever.
            #
            # `submitted/` and `closed/` still do NOT rebuild. That is the distinction that
            # matters: drafts track the data layer, sent documents are a frozen record.
            #
            # Only SOURCE counts as a shared input. assets/, cv/*/generated/ and
            # data/publications.json are written by the build itself and committed back, so
            # treating them as inputs would make every bot commit trigger a full rebuild on
            # the next push — a rebuild whose only effect is a new date stamp on every PDF.
            # (Their real sources — cv/publications.bib, the templates — are still watched.)
            derived='^assets/|^cv/[^/]+/generated/|^data/publications\.json$'
            shared=$(printf '%s\n' "$changed" | { grep -vE "$derived" || true; } \
                     | { grep -E '^(data|cv|scripts)/|^\.github/workflows/tailor-cv\.yml$' \
                         || true; })
            if [ -n "$shared" ]; then
              picked=$(drafting)
              echo "::notice::Shared input changed ($(printf '%s' "$shared" | head -1)) —" \
                   "rebuilding every drafting application."
            fi
          fi

          slugs=$(printf '%s' "$picked" | { grep -v '^$' || true; } | sort -u | jq -R . | jq -sc .)
          echo "slugs=$slugs" >> "$GITHUB_OUTPUT"
          echo "count=$(echo "$slugs" | jq 'length')" >> "$GITHUB_OUTPUT"
          echo "Building: $slugs"

          frozen=$({ find applications/submitted applications/closed \
                       -mindepth 2 -maxdepth 2 -name manifest.json 2>/dev/null || true; } | wc -l)
          if [ "$frozen" -gt 0 ]; then
            echo "::notice::$frozen submitted/closed application(s) left frozen."
          fi

  tailor:
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false # one bad application must not hide the others' results
      matrix:
        slug: ${{ fromJson(needs.discover.outputs.slugs) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      # The variant shell \inputs metrics.tex, which tailor.js copies into build/<slug>/.
      - name: Generate metrics
        run: node scripts/emit-metrics-tex.js

      # Tectonic instead of a TeX Live container.
      #
      # The xu-cheng/latex-action image is 7.8 GB, and pulling it was 2m16s of a 2m47s job —
      # 81% — while LaTeX itself took seconds (the cover letter, compiled straight after with
      # the image already warm, took 11s). Tectonic is a ~20 MB binary that fetches only the
      # packages a document actually uses and caches them.
      #
      # Verified on these exact sources before switching: same page counts, byte-identical
      # LaTeX font warnings, and PDFs within 1% of the container's (58036 vs 57537 bytes for
      # the CV; 23640 vs 23634 for the letter — the difference is the date stamp). Warm
      # compile locally: 0.98s.
      #
      # The canonical biosketch deliberately stays on pdfLaTeX in build-cv.yml, because that
      # document is also compiled on Overleaf and the two should not drift apart.
      - name: Cache Tectonic's package bundle
        uses: actions/cache@v4
        with:
          path: ~/.cache/Tectonic
          key: tectonic-${{ env.TECTONIC_VERSION }}-${{ hashFiles('cv/onepage/*.cls') }}
          restore-keys: tectonic-${{ env.TECTONIC_VERSION }}-

      - name: Install Tectonic
        run: |
          url="https://github.com/tectonic-typesetting/tectonic/releases/download/tectonic%40${TECTONIC_VERSION}/tectonic-${TECTONIC_VERSION}-x86_64-unknown-linux-musl.tar.gz"
          curl -fsSL "$url" | tar xz
          sudo mv tectonic /usr/local/bin/
          tectonic --version

      # THE GATE, then the render. `tailor` runs the verifier itself, but --strict lives here:
      # locally the smell-test warnings are advisory because a human is reading them; in CI
      # nobody reads a warning, so they become failures.
      - name: Verify every claim traces to the data layer
        run: node scripts/verify-application.js "${{ matrix.slug }}" --strict

      - name: Render tailored CV and cover letter
        run: node scripts/tailor.js "${{ matrix.slug }}" --skip-verify

      # build/<slug>/ is self-contained — tailor.js copied the .cls and fonts/ in, because
      # the class resolves `Path = fonts/lato/` against the working directory. That is why
      # tectonic runs FROM that directory rather than being pointed at the file.
      #
      # letter.json is optional — an application may be CV-only — so the letter's existence
      # is decided here and handed to the staging step.
      - id: compile
        name: Compile the tailored one-pager and cover letter
        working-directory: build/${{ matrix.slug }}
        run: |
          tectonic --keep-logs cv.tex
          if [ -f letter.tex ]; then
            tectonic --keep-logs letter.tex
            echo "letter=true" >> "$GITHUB_OUTPUT"
          else
            echo "letter=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No letter.json for ${{ matrix.slug }} — building the CV only."
          fi

      # The Deedy template overflows to a second page silently, and a tailored variant adds a
      # publications block to an already-full page. A two-page "one-pager" is the most likely
      # way this goes wrong unnoticed, so assert it rather than trusting a glance.
      - name: Assert one page, and a dated edge stamp
        run: |
          # The page count comes from the TeX log, not from pdfinfo. This used to
          # `apt-get update && apt-get install poppler-utils`, which cost ~10s per application
          # and put a package mirror on the critical path of every build — to learn a number
          # xelatex had already written down: "Output written on cv.xdv (1 page, 37544 bytes)."
          log="build/${{ matrix.slug }}/cv.log"
          [ -f "$log" ] || { echo "::error::No $log — the compile step did not run."; exit 1; }

          pages=$(sed -nE 's/.*Output written on [^ ]+ \(([0-9]+) pages?,.*/\1/p' "$log" | tail -1)
          echo "one-pager pages: ${pages:-unknown}"
          if [ -z "$pages" ]; then
            echo "::error::Could not read a page count from $log. Did the compile fail?"
            exit 1
          fi
          if [ "$pages" -ne 1 ]; then
            echo "::error::Tailored one-pager is $pages pages. Trim the manifest (fewer bullets, fewer skill lines, fewer publications)."
            exit 1
          fi

          # The CV is rebuilt whenever the data layer moves, so several PDFs of the same
          # application can exist over time. The "Last Updated" stamp in the top-right corner
          # (\lastupdated in deedy-resume-openfont.cls) is the only thing that tells them apart.
          # If it ever silently disappeared you could not tell which build you were holding.
          #
          # Checked against the SHELL rather than by extracting text from the PDF: reading the
          # PDF needs poppler, and the realistic way this regresses is someone dropping the
          # macro from the shell or the class, which this catches just as well — for free.
          if ! grep -q '\\lastupdated' "build/${{ matrix.slug }}/cv.tex"; then
            echo "::error::No \\lastupdated in the tailored shell — the CV would carry no date stamp."
            exit 1
          fi
          if ! grep -q 'Last Updated' "build/${{ matrix.slug }}/deedy-resume-openfont.cls"; then
            echo "::error::The class no longer defines the 'Last Updated' stamp."
            exit 1
          fi

      # Staged under the application's own path, so the commit job can place the files without
      # rediscovering which status folder each slug lives in.
      - name: Stage the documents for commit
        run: |
          appdir=$(dirname "$(find applications -mindepth 3 -maxdepth 3 -name manifest.json \
                              -path "*/${{ matrix.slug }}/*" | head -1)")
          echo "application dir: $appdir"
          mkdir -p "out/$appdir"
          cp "build/${{ matrix.slug }}/cv.pdf" "out/$appdir/cv.pdf"
          if [ "${{ steps.compile.outputs.letter }}" = "true" ]; then
            cp "build/${{ matrix.slug }}/letter.pdf" "out/$appdir/letter.pdf"
            cp "build/${{ matrix.slug }}/letter.txt" "out/$appdir/letter.txt"
            # letter.md is the reviewer's copy — pasted into a doc, marked up, exported there.
            # Unlike the others it needs no LaTeX, so tailor.js already wrote it straight into
            # $appdir; this stages that file rather than one from build/. Copied here anyway so
            # a rebuild triggered by a data-layer change refreshes it like everything else.
            cp "$appdir/letter.md" "out/$appdir/letter.md"
          fi

      - name: Upload documents
        uses: actions/upload-artifact@v4
        with:
          name: documents-${{ matrix.slug }}
          path: out/
          if-no-files-found: error
          retention-days: 1 # a handoff to the commit job, not the record

  # ONE job commits, after every application has built. Committing inside the matrix would have
  # parallel jobs pushing to the same branch and clobbering each other.
  #
  # `always()` is what makes `fail-fast: false` above actually mean something. Without it, one
  # application failing its one-page assertion marks the whole `tailor` job failed, this job is
  # skipped, and the OTHER applications' PDFs — which compiled perfectly — are thrown away. One
  # over-long manifest would silently block every other document from ever reaching the repo.
  # So: commit whatever compiled, and let the failed leg stay red on its own.
  commit:
    needs: [discover, tailor]
    if: always() && needs.discover.outputs.count != '0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download every application's documents
        uses: actions/download-artifact@v4
        with:
          pattern: documents-*
          merge-multiple: true # they share the applications/<status>/<slug>/ path layout
          path: incoming
        continue-on-error: true # no artifacts at all is a normal outcome when every leg failed

      - name: Place documents beside their applications
        run: |
          if [ ! -d incoming/applications ]; then
            echo "::warning::No documents were produced — every application failed to build."
            exit 0
          fi
          cp -r incoming/applications/. applications/
          rm -rf incoming
          find applications \( -name '*.pdf' -o -name 'letter.txt' \) | sort

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add applications
          # [skip ci] so this automated commit does not retrigger the workflow.
          if git diff --cached --quiet; then
            echo "documents unchanged — nothing to commit"
          else
            git commit -m "build: tailored CV + cover letter [automated] [skip ci]"
            # Another push may have landed while this run compiled.
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
